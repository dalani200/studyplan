  /* Study log interface */
  body{background:#f6f7f4;color:#20251f}
  body>.shell,body>.overlay,body>.toast{display:none!important}

  .log-form{padding:17px 19px 19px}.log-fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.log-field{display:flex;flex-direction:column;gap:5px}.log-field.full{grid-column:1/-1}.log-field label{font-size:11px;font-weight:700;color:#656d64}.log-field input,.log-field textarea{width:100%;border:1px solid #e6e8e2;border-radius:9px;padding:10px 11px;font:inherit;font-size:13px;outline:0;background:white}.log-field input:focus,.log-field textarea:focus{border-color:#8ba693;box-shadow:0 0 0 3px #426b5514}.log-field textarea{resize:vertical;min-height:112px;line-height:1.6}.log-form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}

  .log-side{display:grid;gap:14px}.log-note{padding:16px 18px;background:#eef3ec;border-radius:14px;color:#667465;font-size:11px;line-height:1.7}.log-note b{color:#426b55}.log-status{padding:13px 15px;font-size:11px;color:#777e75;border-top:1px solid #eff0ec}.log-status.err{color:#a94735}.log-toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#25392c;color:white;padding:10px 15px;border-radius:10px;font-size:12px;transition:.2s;z-index:12}.log-toast.show{opacity:1;transform:translate(-50%,0)}
  .log-auth{min-height:calc(100vh - 80px);display:grid;place-items:center}.log-auth-card{width:min(100%,410px);padding:27px;background:#fff;border:1px solid #e8eae5;border-radius:17px;box-shadow:0 12px 35px #2934260a}.log-auth-card h1{font-size:23px;letter-spacing:-.05em;margin:0 0 6px}.log-auth-card p{margin:0 0 20px;color:#7b8279;font-size:12px;line-height:1.7}.log-auth-card input{width:100%;border:1px solid #e6e8e2;border-radius:9px;padding:11px;outline:0;font:inherit}.log-auth-card .log-btn{width:100%;margin-top:10px;padding:11px}.log-auth-msg{margin-top:13px;color:#426b55;font-size:12px;line-height:1.6}
  @media(max-width:720px){#studylog-root{padding:17px 12px 35px}.log-grid{grid-template-columns:1fr}.log-head h1{font-size:27px}.log-top{padding-bottom:23px}.log-side{grid-template-columns:1fr}.log-user{max-width:130px}}
  @media(max-width:430px){.log-user{display:none}.log-fields{grid-template-columns:1fr}.log-field.full{grid-column:auto}.log-card-head,.log-form{padding-left:14px;padding-right:14px}.log-history{padding-left:13px;padding-right:13px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5 9.5 17 19 7.5"/></svg></div>스터디 플랜</div>
      <div class="top-actions"><span class="today-label" id="todayLabel"></span><button class="btn" id="exportBtn" title="일정 백업">백업</button><button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> 일정 추가</button></div>
    </header>
    <section class="hero"><div><div class="eyebrow">YOUR STUDY SPACE</div><h1>공부의 흐름을 만들어요</h1><p id="heroDate"></p></div><div class="week-nav"><button class="btn icon" id="prevWeek" aria-label="이전 주"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button><strong id="weekLabel"></strong><button class="btn icon" id="nextWeek" aria-label="다음 주"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg></button></div></section>
    <section class="stats">
      <div class="stat"><div class="stat-head"><span>이번 주 계획</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span></div><div class="stat-value" id="weekTotal">0</div><div class="stat-foot">등록한 학습 일정</div></div>
      <div class="stat"><div class="stat-head"><span>완료한 일정</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg></span></div><div class="stat-value" id="weekDone">0</div><div class="stat-foot">이번 주 완료</div></div>
      <div class="stat"><div class="stat-head"><span>공부 시간</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></div><div class="stat-value" id="weekHours">0h</div><div class="stat-foot">이번 주 계획 시간</div></div>
      <div class="stat"><div class="stat-head"><span>달성률</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5m0 14h16M8 15l4-4 3 2 5-7"/></svg></span></div><div class="stat-value" id="weekRate">0%</div><div class="stat-foot">완료 일정 기준</div></div>
    </section>
    <div class="layout">
      <section class="card agenda">
        <div class="card-head"><div><div class="card-title">학습 일정</div><div class="card-sub" id="agendaSub">이번 주 계획을 한눈에 확인해요</div></div><div class="tabs"><button class="tab active" data-range="week">이번 주</button><button class="tab" data-range="all">전체</button></div></div>
        <div class="toolbar"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="searchInput" type="search" placeholder="일정 검색"></div><select id="subjectFilter" class="filter-select"><option value="">모든 과목</option></select><select id="statusFilter" class="filter-select"><option value="">모든 상태</option><option value="todo">진행 예정</option><option value="done">완료</option></select></div>
        <div class="task-list" id="taskList"></div>
      </section>
      <aside class="side">
        <section class="card week-card"><div class="side-head"><strong>주간 리듬</strong><span id="chartSub">예정 시간</span></div><div class="week-chart" id="weekChart"></div><div class="week-summary"><span>이번 주 총 학습 예정</span><b id="chartTotal">0시간</b></div></section>
        <section class="card focus-card"><div class="focus-head"><strong>다음 일정</strong><button id="focusAdd">+ 추가하기</button></div><div id="focusContent"></div></section>
        <div class="tip"><b>작은 팁</b><br>계획은 짧고 구체적으로 적어보세요. 완료 체크를 누르면 주간 달성률에 반영돼요.</div>
      </aside>
    </div>
    <footer class="footer"><span>일정은 이 브라우저에 자동 저장됩니다.</span><button id="importBtn">백업 파일 불러오기</button><input type="file" id="importFile" accept="application/json,.json" hidden></footer>
  </main>
  <div class="overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form class="modal" id="taskForm"><div class="modal-head"><h2 id="modalTitle">새 일정</h2><button class="close" type="button" id="closeModal" aria-label="닫기">✕</button></div><div class="form-grid"><div class="field full"><label for="title">무엇을 공부할까요?</label><input id="title" name="title" required maxlength="90" placeholder="예: 미적분 개념 복습"></div><div class="field"><label for="subject">과목</label><input id="subject" name="subject" maxlength="24" placeholder="예: 수학"></div><div class="field"><label for="duration">예정 시간 (분)</label><input id="duration" name="duration" type="number" min="5" max="1440" step="5" value="60"></div><div class="field"><label for="date">날짜</label><input id="date" name="date" type="date" required></div><div class="field"><label for="time">시작 시간</label><input id="time" name="time" type="time"></div><div class="field full"><label for="note">메모 (선택)</label><textarea id="note" name="note" maxlength="240" placeholder="범위나 목표를 간단히 적어두세요"></textarea></div></div><div class="modal-actions"><button class="btn" type="button" id="cancelModal">취소</button><button class="btn primary" type="submit">일정 저장</button></div></form></div>
  <div class="toast" id="toast"></div>
  <script>
  (()=>{
    const KEY='study-plan-v1';let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(tasks))tasks=[]}catch{tasks=[]}
    let weekOffset=0,range='week',search='',subject='',status='';
    const $=s=>document.querySelector(s), today=new Date();today.setHours(0,0,0,0);
    const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
    const startOfWeek=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
    const monday=new Date(startOfWeek(today));monday.setDate(monday.getDate()+weekOffset*7);const sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
    const fmt=(d,opts={month:'long',day:'numeric'})=>new Intl.DateTimeFormat('ko-KR',opts).format(d);
    function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
    function within(t,a,b){const d=parseDate(t.date);return d>=a&&d<=b}
    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function render(){
      $('#todayLabel').textContent=fmt(today,{year:'numeric',month:'long',day:'numeric',weekday:'short'});
      $('#heroDate').textContent=`${fmt(today,{year:'numeric',month:'long',day:'numeric',weekday:'long'})} · 나에게 맞는 페이스로 꾸준히`;$('#weekLabel').textContent=`${fmt(monday,{month:'short',day:'numeric'})} – ${fmt(sunday,{month:'short',day:'numeric'})}`;
      const wt=tasks.filter(t=>within(t,monday,sunday)),done=wt.filter(t=>t.done).length,minutes=wt.reduce((a,t)=>a+(Number(t.duration)||0),0);
      $('#weekTotal').textContent=wt.length;$('#weekDone').textContent=done;$('#weekHours').textContent=`${Math.round(minutes/6)/10}h`;$('#weekRate').textContent=`${wt.length?Math.round(done/wt.length*100):0}%`;$('#chartTotal').textContent=`${Math.round(minutes/6)/10}시간`;
      const subjects=[...new Set(tasks.map(t=>t.subject).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));const sel=$('#subjectFilter'),old=sel.value;sel.innerHTML='<option value="">모든 과목</option>'+subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(subjects.includes(old))sel.value=old;
      renderChart();renderList();renderFocus();
    }
    function renderChart(){const chart=$('#weekChart');const vals=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);const day=tasks.filter(t=>t.date===iso(d));return {d,mins:day.reduce((a,t)=>a+(Number(t.duration)||0),0),done:day.length>0&&day.every(t=>t.done)}});const max=Math.max(60,...vals.map(v=>v.mins));chart.innerHTML=vals.map(v=>{const h=v.mins?Math.max(8,Math.round(v.mins/max*76)):0;const isToday=iso(v.d)===iso(today);return `<div class="daycol"><div class="barbox"><div class="bar ${isToday?'today':v.done?'donebar':''}" style="height:${h}px" title="${Math.round(v.mins/60*10)/10}시간"></div></div><span class="bar-label ${isToday?'today':''}">${'월화수목금토일'[v.d.getDay()===0?6:v.d.getDay()-1]}</span></div>`}).join('')}
    function renderList(){let visible=tasks.filter(t=>(range==='all'||within(t,monday,sunday))&&(!subject||t.subject===subject)&&(!status||(status==='done'?t.done:!t.done))&&(!search||`${t.title} ${t.subject} ${t.note||''}`.toLowerCase().includes(search.toLowerCase())));visible.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));$('#agendaSub').textContent=range==='week'?`${fmt(monday,{month:'long',day:'numeric'})} – ${fmt(sunday,{month:'long',day:'numeric'})} 일정`:`전체 ${tasks.length}개 일정`;
      if(!visible.length){$('#taskList').innerHTML=`<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3h8l4 4v14H4V3h4Z"/><path d="M8 3v5h8V3M8 13h8M8 17h5"/></svg></div><strong>${tasks.length?'조건에 맞는 일정이 없어요':'아직 등록한 일정이 없어요'}</strong><span>${tasks.length?'검색어나 필터를 바꿔보세요':'첫 일정을 추가해 공부 계획을 시작해보세요.'}</span></div>`;return}
      let current='';$('#taskList').innerHTML=visible.map(t=>{const label=fmt(parseDate(t.date),{month:'long',day:'numeric',weekday:'short'}),group=label!==current?(current=label,`<div class="day-label">${label}${t.date===iso(today)?' · 오늘':''}</div>`):'';return `${group}<div class="task ${t.done?'done':''}"><input type="checkbox" class="check" data-check="${esc(t.id)}" ${t.done?'checked':''} aria-label="완료 표시"><div><div class="task-name">${esc(t.title)}</div><div class="task-meta">${t.subject?`<span class="tag">${esc(t.subject)}</span>`:''}${t.time?`<span>${esc(t.time)}</span>`:''}${t.note?`<span title="${esc(t.note)}">${esc(t.note.length>32?t.note.slice(0,32)+'…':t.note)}</span>`:''}</div></div><div class="task-actions"><span class="duration">${Number(t.duration)||0}분</span><button class="delete" data-delete="${esc(t.id)}" title="삭제" aria-label="${esc(t.title)} 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button></div></div>`}).join('');
      $('#taskList').querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{const t=tasks.find(x=>x.id===el.dataset.check);if(t){t.done=el.checked;save()}}));$('#taskList').querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==el.dataset.delete);save();toast('일정을 삭제했어요.')}));
    }
    function renderFocus(){const upcoming=tasks.filter(t=>!t.done&&t.date>=iso(today)).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''))[0],box=$('#focusContent');if(!upcoming){box.innerHTML='<p class="focus-empty">다가오는 일정이 없어요.<br>새 일정을 추가해볼까요?</p>';return}const d=parseDate(upcoming.date),when=upcoming.date===iso(today)?`오늘${upcoming.time?' · '+upcoming.time:''}`:`${fmt(d,{month:'long',day:'numeric',weekday:'short'})}${upcoming.time?' · '+upcoming.time:''}`;box.innerHTML=`<div class="focus-body"><div class="focus-subject">${esc(upcoming.subject||'공부 일정')}</div><div class="focus-name">${esc(upcoming.title)}</div><div class="focus-time">${when} · ${Number(upcoming.duration)||0}분</div><div class="focus-progress"><i style="width:0%"></i></div></div>`}
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}
    const modal=$('#modal');function openModal(){const f=$('#taskForm');f.reset();$('#date').value=iso(today);$('#duration').value=60;modal.classList.add('open');$('#title').focus()}function closeModal(){modal.classList.remove('open')}
    $('#addBtn').addEventListener('click',openModal);$('#focusAdd').addEventListener('click',openModal);$('#closeModal').addEventListener('click',closeModal);$('#cancelModal').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    $('#taskForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),title=String(f.get('title')).trim();if(!title)return;tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title,subject:String(f.get('subject')).trim(),duration:Math.max(5,Number(f.get('duration'))||60),date:String(f.get('date')),time:String(f.get('time')),note:String(f.get('note')).trim(),done:false});closeModal();save();toast('새 일정을 저장했어요.')});
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{range=b.dataset.range;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderList()}));$('#searchInput').addEventListener('input',e=>{search=e.target.value;renderList()});$('#subjectFilter').addEventListener('change',e=>{subject=e.target.value;renderList()});$('#statusFilter').addEventListener('change',e=>{status=e.target.value;renderList()});$('#prevWeek').addEventListener('click',()=>{weekOffset--;render()});$('#nextWeek').addEventListener('click',()=>{weekOffset++;render()});
    $('#exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`study-plan-${iso(today)}.json`;a.click();URL.revokeObjectURL(a.href);toast('백업 파일을 저장했어요.')});$('#importBtn').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text()),incoming=Array.isArray(data)?data:data.tasks;if(!Array.isArray(incoming))throw Error();tasks=incoming.filter(t=>t&&t.title&&t.date).map(t=>({id:String(t.id||Date.now()+Math.random()),title:String(t.title),subject:String(t.subject||''),duration:Number(t.duration)||60,date:String(t.date),time:String(t.time||''),note:String(t.note||''),done:!!t.done}));save();toast(`${tasks.length}개 일정을 불러왔어요.`)}catch{toast('올바른 스터디 플랜 백업 파일이 아니에요.')}e.target.value=''});
    render();
  })();
  </script>
  <div id="studylog-root"></div><div class="log-toast" id="logToast"></div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './supabase-config.js';

    const root = document.querySelector('#studylog-root');
    const toastEl = document.querySelector('#logToast');
    const validConfig = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('YOUR_') && SUPABASE_PUBLISHABLE_KEY && !SUPABASE_PUBLISHABLE_KEY.includes('YOUR_');
    let supabase, session, logs = [], editingId = null, query = '';
    const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const localDate = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const prettyDate = value => { const [y,m,d]=value.split('-').map(Number); return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(y,m-1,d)); };
    function toast(message){toastEl.textContent=message;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2200)}
    function setStatus(message='', error=false){const el=document.querySelector('#logStatus');if(el){el.textContent=message;el.classList.toggle('err',error)}}

    function renderLogin(message=''){
      root.innerHTML=`<div class="log-auth"><section class="log-auth-card"><div class="log-brand"><span class="log-mark">✎</span>스터디 기록</div><h1 style="margin-top:22px">내 공부 기록</h1><p>이메일로 로그인하면 폰과 컴퓨터에서 같은 기록을 볼 수 있어요. 로그인 링크를 보내드립니다.</p><form id="loginForm"><input id="loginEmail" type="email" autocomplete="email" required placeholder="이메일 주소"><button class="log-btn main" type="submit">로그인 링크 받기</button></form>${message?`<div class="log-auth-msg">${escapeHtml(message)}</div>`:''}</section></div>`;
      document.querySelector('#loginForm').addEventListener('submit', async event=>{
        event.preventDefault();const button=event.currentTarget.querySelector('button');button.disabled=true;button.textContent='보내는 중…';
        const email=document.querySelector('#loginEmail').value.trim();
        try{const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.href.split('#')[0]}});if(error)throw error;renderLogin('로그인 링크를 보냈어요. 이메일을 열어 이 기기에서 링크를 눌러주세요.');}
        catch(error){button.disabled=false;button.textContent='로그인 링크 받기';document.querySelector('.log-auth-msg')?.remove();const p=document.createElement('div');p.className='log-auth-msg';p.style.color='#a94735';p.textContent=error.message;document.querySelector('.log-auth-card').append(p)}
      });
    }

    function renderApp(){
      const today=localDate();const currentMonth=today.slice(0,7);const monthCount=logs.filter(x=>x.study_date.startsWith(currentMonth)).length;const subjects=[...new Set(logs.map(x=>x.subject).filter(Boolean))].length;
      const visible=logs.filter(x=>`${x.content} ${x.subject} ${x.study_date}`.toLowerCase().includes(query.toLowerCase()));
      const list=visible.length?visible.map(log=>`<article class="log-entry"><div class="log-entry-head"><div><span class="log-entry-date">${escapeHtml(prettyDate(log.study_date))}</span>${log.subject?`<span class="log-entry-subject">${escapeHtml(log.subject)}</span>`:''}</div><div class="log-entry-actions"><button type="button" data-edit="${escapeHtml(log.id)}">수정</button><button type="button" data-delete="${escapeHtml(log.id)}">삭제</button></div></div><div class="log-entry-content">${escapeHtml(log.content)}</div></article>`).join(''):`<div class="log-empty"><strong>${logs.length?'검색 결과가 없어요':'아직 공부 기록이 없어요'}</strong>${logs.length?'검색어를 바꿔보세요.':'오늘 공부한 내용을 첫 기록으로 남겨보세요.'}</div>`;
      root.innerHTML=`<div class="log-shell"><header class="log-top"><div class="log-brand"><span class="log-mark">✎</span>스터디 기록</div><div class="log-actions"><span class="log-user" title="${escapeHtml(session.user.email||'')} ">${escapeHtml(session.user.email||'로그인됨')}</span><button class="log-btn" id="refreshLogs">새로고침</button><button class="log-btn" id="logout">로그아웃</button></div></header><div class="log-head"><div class="log-eyebrow">YOUR STUDY JOURNAL</div><h1>오늘 공부한 것을 기록해요</h1><p>한 줄이어도 괜찮아요. 꾸준히 쌓인 기록이 나만의 공부 흐름이 됩니다.</p></div><div class="log-grid"><section class="log-card"><div class="log-card-head"><h2>공부 기록 남기기</h2><span>${escapeHtml(prettyDate(today))}</span></div><form class="log-form" id="logForm"><div class="log-fields"><div class="log-field"><label for="studyDate">공부한 날짜</label><input type="date" id="studyDate" required value="${today}"></div><div class="log-field"><label for="studySubject">과목 (선택)</label><input id="studySubject" maxlength="40" placeholder="예: 영어"></div><div class="log-field full"><label for="studyContent">오늘 공부한 내용</label><textarea id="studyContent" maxlength="10000" required placeholder="예: 관계대명사 개념 정리, 문제 12개 풀이"></textarea></div></div><div class="log-form-actions"><button type="button" class="log-btn" id="cancelEdit" hidden>수정 취소</button><button type="submit" class="log-btn main" id="saveLog">기록 저장</button></div></form><div class="log-status" id="logStatus">저장된 기록은 로그인한 계정에서만 볼 수 있어요.</div></section><aside class="log-side"><section class="log-card"><div class="log-card-head"><h2>기록 모아보기</h2><span>전체 ${logs.length}개</span></div><div style="padding:12px 15px 0"><input id="logSearch" type="search" placeholder="내용이나 과목 검색" value="${escapeHtml(query)}" style="width:100%;padding:9px 11px;border:1px solid #e6e8e2;border-radius:9px;outline:0;font:inherit;font-size:12px"></div><div class="log-history" id="logHistory">${list}</div></section><div class="log-note"><b>${monthCount}개 기록</b>을 이번 달에 남겼어요.<br>과목 ${subjects}개에서 공부를 이어가고 있습니다.</div><div class="log-note">로그인 링크가 열리지 않으면 같은 주소의 스터디 페이지에서 이메일을 다시 입력해 주세요.</div></aside></div></div>`;
      document.querySelector('#logForm').addEventListener('submit',saveLog);
      document.querySelector('#cancelEdit').addEventListener('click',()=>{editingId=null;renderApp()});
      document.querySelector('#refreshLogs').addEventListener('click',loadLogs);
      document.querySelector('#logout').addEventListener('click',async()=>{const {error}=await supabase.auth.signOut();if(error)setStatus(error.message,true)});
      document.querySelector('#logSearch').addEventListener('input',event=>{query=event.target.value;renderApp();const input=document.querySelector('#logSearch');input.focus();input.setSelectionRange(query.length,query.length)});
      document.querySelectorAll('[data-edit]').forEach(button=>button.addEventListener('click',()=>{const log=logs.find(item=>item.id===button.dataset.edit);if(!log)return;editingId=log.id;document.querySelector('#studyDate').value=log.study_date;document.querySelector('#studySubject').value=log.subject||'';document.querySelector('#studyContent').value=log.content;document.querySelector('#saveLog').textContent='수정 저장';document.querySelector('#cancelEdit').hidden=false;document.querySelector('#studyContent').focus()}));
      document.querySelectorAll('[data-delete]').forEach(button=>button.addEventListener('click',async()=>{const log=logs.find(item=>item.id===button.dataset.delete);if(!log||!confirm('이 공부 기록을 삭제할까요?'))return;const {error}=await supabase.from('study_logs').delete().eq('id',log.id);if(error){setStatus(error.message,true);return}await loadLogs();toast('기록을 삭제했어요.')}));
    }

    async function loadLogs(){
      setStatus('기록을 불러오는 중…');
      const {data,error}=await supabase.from('study_logs').select('id,study_date,subject,content,created_at,updated_at').order('study_date',{ascending:false}).order('created_at',{ascending:false});
      if(error){setStatus(error.message,true);return}logs=data||[];renderApp();
    }
    async function saveLog(event){
      event.preventDefault();const button=document.querySelector('#saveLog');button.disabled=true;button.textContent='저장 중…';
      const values={study_date:document.querySelector('#studyDate').value,subject:document.querySelector('#studySubject').value.trim(),content:document.querySelector('#studyContent').value.trim()};
      let result;
      if(editingId)result=await supabase.from('study_logs').update(values).eq('id',editingId);
      else result=await supabase.from('study_logs').insert({...values,user_id:session.user.id});
      if(result.error){button.disabled=false;button.textContent=editingId?'수정 저장':'기록 저장';setStatus(result.error.message,true);return}
      editingId=null;query='';await loadLogs();toast('공부 기록을 저장했어요.');
    }

    if(!validConfig){root.innerHTML=`<div class="log-auth"><section class="log-auth-card"><div class="log-brand"><span class="log-mark">✎</span>스터디 기록</div><h1 style="margin-top:22px">Supabase 연결이 필요해요</h1><p><code>supabase-config.js</code>에 프로젝트 URL과 publishable key를 입력한 뒤 페이지를 새로고침하세요.</p></section></div>`;}
    else {
      supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
      supabase.auth.onAuthStateChange((_event,nextSession)=>{session=nextSession;if(session)loadLogs();else renderLogin()});
      const {data}=await supabase.auth.getSession();session=data.session;if(session)await loadLogs();else renderLogin();
    }
  </script>
</body>
</html>
